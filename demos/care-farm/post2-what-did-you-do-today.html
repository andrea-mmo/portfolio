<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>Post 02 · What did you do today? (anonymised demo)</title>
<link href="assets/fonts.css" rel="stylesheet">
<!-- Anonymised version of a creative task. Stock photos from Unsplash: Sarah Halliday, C Cai, Carson van Tol, Kerry Nicholson. -->
<style>
  :root{--forest:#1f4030;--cream:#f5efe2;--terra:#d9683f;--peach:#f4b183;--sage:#a9c08c;--sky:#8cc0d6;--berry:#c4537a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;overflow:hidden;font-family:Poppins,sans-serif;background:var(--cream)}
  .post{position:relative;width:1080px;height:1350px;padding:64px 64px 0}
  .kicker{font-weight:800;font-size:22px;letter-spacing:.14em;color:var(--terra)}
  h1{margin-top:14px;color:var(--forest);font-weight:800;font-size:96px;line-height:.98;letter-spacing:-.03em}
  h1 .u{position:relative;display:inline-block;z-index:0}
  h1 .u::after{content:"";position:absolute;left:-4px;right:-8px;bottom:2px;height:22px;background:var(--peach);z-index:-1;border-radius:6px;transform:rotate(-1.5deg)}
  .grid{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:22px;height:826px}
  .card{position:relative;border-radius:28px;overflow:hidden;background-size:cover;background-repeat:no-repeat}
  .label{position:absolute;left:20px;bottom:20px;font-family:Fredoka,sans-serif;font-weight:600;font-size:34px;color:var(--forest);padding:10px 22px 12px;border-radius:16px;box-shadow:0 6px 18px rgba(20,40,30,.25)}
  .n{position:absolute;top:18px;left:18px;width:50px;height:50px;border-radius:50%;background:#fff;color:var(--forest);font-weight:800;font-size:22px;display:grid;place-items:center}
  .foot{position:absolute;left:64px;right:64px;bottom:0;height:150px;display:flex;align-items:center;justify-content:space-between;border-top:3px solid var(--forest)}
  .foot p{font-size:25px;line-height:1.35;color:var(--forest);font-weight:500;max-width:620px}
  .foot p b{font-weight:800}
  .mark{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;color:var(--forest);border:2px dashed rgba(31,64,48,.45);border-radius:14px;padding:10px 22px}
</style></head>
<body><div class="post">
  <div class="kicker">A DAY ON THE FARM</div>
  <h1>“What did you<br>do <span class="u">today?”</span></h1>
  <div class="grid">
    <div class="card" style="background-image:url(assets/hen.jpg);background-position:50% 50%">
      <div class="n">1</div><div class="label" style="background:var(--peach);transform:rotate(-3deg)">Held a hen</div></div>
    <div class="card" style="background-image:url(assets/pancake.jpg);background-position:50% 55%">
      <div class="n">2</div><div class="label" style="background:var(--terra);color:#fff;transform:rotate(2deg);top:84px;bottom:auto;left:auto;right:20px">Flipped a pancake</div></div>
    <div class="card" style="background-image:url(assets/birdhouse.jpg);background-position:50% 35%">
      <div class="n">3</div><div class="label" style="background:var(--sage);transform:rotate(2.5deg)">Built a bird box</div></div>
    <div class="card" style="background-image:url(assets/willow.jpg);background-position:50% 60%">
      <div class="n">4</div><div class="label" style="background:#fff;transform:rotate(-2deg)">Wove a willow basket</div></div>
  </div>
  <div class="foot">
    <p>Hands-on days that build <b>confidence, independence</b> and real friendships.</p>
    <span class="mark">Farm logo</span>
  </div>
</div></body></html>
